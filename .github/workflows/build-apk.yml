name: Diagnose Auth

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect auth navigation
        shell: bash
        run: |
          rm -rf extracted && mkdir extracted
          unzip -q tani_next_release_fixed.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          for f in \
            "$PROJECT_DIR/app/src/main/java/com/tani/app/ui/auth/AuthFragment.kt" \
            "$PROJECT_DIR/app/src/main/java/com/tani/app/MainActivity.kt"; do
            echo "===== $f ====="; cat "$f"; done
          find "$PROJECT_DIR/app/src/main/res" -type f \( -path '*/navigation/*' -o -name '*auth*.xml' -o -name 'activity_main.xml' \) -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;
