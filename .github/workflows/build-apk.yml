name: Diagnose Tani Sources

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect broken sources
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q tani_next_release_fixed.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          echo '===== app/build.gradle.kts ====='
          cat "$PROJECT_DIR/app/build.gradle.kts"
          echo '===== Repository.kt ====='
          cat "$PROJECT_DIR/app/src/main/java/com/tani/app/data/Repository.kt"
          echo '===== Supabase.kt ====='
          cat "$PROJECT_DIR/app/src/main/java/com/tani/app/data/Supabase.kt"
          echo '===== Kotlin file list ====='
          find "$PROJECT_DIR/app/src/main/java" -type f -name '*.kt' | sort
