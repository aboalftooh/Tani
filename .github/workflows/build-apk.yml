name: Build APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q tani_next_release_fixed.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Build debug APK
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f -name gradlew -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found in extracted project"
            exit 2
          fi
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          find . -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-apk
          path: extracted/**/*.apk
          if-no-files-found: error
