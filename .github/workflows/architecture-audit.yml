name: Architecture Audit

on:
  pull_request:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect project docs and backend schema
        shell: bash
        run: |
          rm -rf extracted && mkdir extracted
          unzip -q tani_next_release_fixed.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          for f in "$PROJECT_DIR/README.md" "$PROJECT_DIR/IMPLEMENTATION_STATUS.md" "$PROJECT_DIR/GRADLE_SETUP.txt" "$PROJECT_DIR/supabase/schema.sql" "$PROJECT_DIR/supabase/seed_demo.sql" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
